<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>국어의 정답</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15181e; --ink2:#4a5160; --mut:#7b8392; --line:#e3e6eb;
  --acc:#2f5bea; --acc-soft:#e8edfd;
  --todo:#d9480f; --todo-soft:#fff0e6; --ok:#12805c; --ok-soft:#e3f6ee; --sub:#7048e8; --sub-soft:#efe9fd;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1218; --card:#181c24; --ink:#eef0f4; --ink2:#b4bac6; --mut:#8a92a1; --line:#272c37;
    --acc:#7b9bff; --acc-soft:#1f2a4d;
    --todo:#ff9b66; --todo-soft:#3a2417; --ok:#4cd6a0; --ok-soft:#123428; --sub:#b197fc; --sub-soft:#2a2347;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:20px;margin:0}
h2{font-size:13px;letter-spacing:.04em;color:var(--mut);margin:22px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.hdr button{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer}
.login{margin-top:12vh;text-align:center}
.login input{width:100%;max-width:300px;font-size:22px;text-align:center;letter-spacing:.12em;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-transform:uppercase}
.login input:focus{outline:0;border-color:var(--acc)}
.login button{display:block;margin:12px auto 0;padding:12px 28px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.err{color:var(--todo);margin-top:10px;min-height:1.4em}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2);font-weight:700;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hero{background:var(--acc);color:#fff;border:0}
.hero .big{font-size:26px;font-weight:800;line-height:1.25;margin:2px 0}
.hero .sm{opacity:.85;font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.chip.todo{background:var(--todo-soft);color:var(--todo)}
.chip.submitted{background:var(--sub-soft);color:var(--sub)}
.chip.checked{background:var(--ok-soft);color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row .t{font-weight:700}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--acc-soft);font-size:13.5px}
.btn{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:9px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;font-size:13.5px}
.dd{font-weight:800;font-size:13px}
.dd.hot{color:var(--todo)}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.area{display:flex;justify-content:space-between;align-items:baseline}
.area .now{font-size:24px;font-weight:800}
.delta{font-size:13px;font-weight:700;margin-left:6px}
.delta.up{color:var(--ok)} .delta.down{color:var(--todo)}
.bars{display:flex;align-items:flex-end;gap:6px;height:86px;margin-top:10px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;opacity:.45}
.bar.last i{opacity:1}
.bar b{font-size:11px;color:var(--ink2);margin-bottom:2px;font-weight:700}
.xl{display:flex;gap:6px;margin-top:3px}
.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.mat{display:flex;justify-content:space-between;align-items:center;color:var(--ink);text-decoration:none;font-weight:600}
a.mat span:last-child{color:var(--acc);font-size:13px}
.land{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#000;padding:0 20px 8vh}
@media (prefers-color-scheme:dark){.land{background:#0f1218;color:#fff}}
.land h1{font-weight:900;font-synthesis:none;font:900 clamp(44px,9vw,84px)/1.15 "Black Han Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em;margin:0 0 22px;text-align:center}
.land .btns{display:flex;gap:10px}
.land .btns button{border:0;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.land .b1{background:#5588dd;color:#fff}
.land .b2{background:#e8f0fd;color:#1f3358}
@media (prefers-color-scheme:dark){.land .b2{background:#1f2a4d;color:#dbe6ff}}
.login button.back{background:none;color:var(--mut);font-size:14px;font-weight:600;padding:8px 0;margin:0 auto 14px;border-radius:0}
.post .t{font-weight:700}
.post .b{margin-top:6px;white-space:pre-wrap;color:var(--ink2)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px}
.cal-h b{font-size:16px}
.cal-h button{background:none;border:0;font-size:22px;color:var(--ink2);cursor:pointer;padding:2px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{text-align:center;font-size:12px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .w.sun,.cal .c.sun .n{color:#d9480f}
.cal .w.sat,.cal .c.sat .n{color:var(--acc)}
.cal .c{min-height:58px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:4px 2px;text-align:center;cursor:default}
.cal .c.off{visibility:hidden}
.cal .c .n{font-size:13px;font-weight:700}
.cal .c.today .n{display:inline-block;min-width:22px;border-radius:99px;background:var(--ink);color:var(--bg)}
.cal .c.les{cursor:pointer;background:var(--acc-soft);border-color:transparent}
.cal .c.les .tm{margin-top:3px;font-size:12px;font-weight:800;color:var(--acc)}
.cal .c.les.past{opacity:.5}
.cal .c.sel{outline:2px solid var(--acc)}
.chg{display:block;width:100%;margin-top:12px;padding:13px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.sent{margin-top:10px;text-align:center;color:var(--ok);font-weight:700;min-height:1.4em}
.req{margin-top:12px}
.req .dp{display:flex;gap:6px;margin:8px 0 12px}
.req .dp button{flex:1;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2);font-size:15px;font-weight:700;cursor:pointer}
.req .dp button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.req input[type=time]{width:100%;font-size:20px;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.req .go{display:block;width:100%;margin-top:12px;padding:13px 0;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.req .x{display:block;margin:8px auto 0;background:none;border:0;color:var(--mut);font-size:14px;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const KEY = 'tutor_code';
  const ITER = 600000;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  }
  const norm = s => {
    let d = s.replace(/\D/g, '');
    if (d.length === 11 && d.startsWith('010')) d = d.slice(3);
    return d;
  };
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
    del() { try { localStorage.removeItem(KEY); } catch (e) {} }
  };

  const pbkdf2 = async code =>
    crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
  async function fileId(code) {
    const base = await pbkdf2(code);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: enc.encode('study-hub-id'), iterations: ITER, hash: 'SHA-256' }, base, 64);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function fetchData(raw) {
    const code = norm(raw);
    if (!/^\d{8}$/.test(code)) throw new Error('코드 형식 오류');
    const r = await fetch('data/' + await fileId(code) + '.bin', { cache: 'no-store' });
    if (!r.ok) throw new Error('코드를 찾을 수 없습니다.');
    const buf = new Uint8Array(await r.arrayBuffer());
    const base = await pbkdf2(code);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: buf.slice(0, 16), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
    return { data: JSON.parse(dec.decode(plain)), saved: code };
  }

  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dday = s => Math.round((parse(s) - today()) / 864e5);
  const ddText = n => n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n);
  const fmt = s => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + '일월화수목금토'[d.getDay()] + ')'; };
  const STATUS = { todo: '해야 함', submitted: '제출함', checked: '확인 완료' };

  const SITE_NAME = '국어의 정답';
  function landing() {
    app.replaceChildren();
    app.append(h('div', { class: 'land' },
      h('h1', {}, SITE_NAME),
      h('div', { class: 'btns' },
        h('button', { class: 'b1', onclick: () => login() }, '로그인'),
        h('button', { class: 'b2', onclick: board }, '게시판'))));
  }
  async function board() {
    app.replaceChildren();
    const list = h('div', {}, h('div', { class: 'empty' }, '불러오는 중...'));
    app.append(h('div', { class: 'hdr' }, h('h1', {}, '게시판'), h('button', { onclick: landing }, '‹ 처음으로')), list);
    try {
      const r = await fetch('board.json', { cache: 'no-store' });
      const posts = r.ok ? await r.json() : [];
      list.replaceChildren();
      if (!posts.length) list.append(h('div', { class: 'card empty' }, '등록된 글이 없습니다.'));
      posts.forEach(p => list.append(h('div', { class: 'card post' },
        h('div', { class: 't' }, p.title), h('div', { class: 'meta' }, p.date || ''), h('div', { class: 'b' }, p.text || ''))));
    } catch (e) { list.replaceChildren(h('div', { class: 'card empty' }, '글을 불러오지 못했습니다.')); }
  }

  function login(msg) {
    app.replaceChildren();
    const input = h('input', { type: 'text', inputmode: 'numeric', placeholder: '휴대폰 번호', autocomplete: 'off', maxlength: '16' });
    const err = h('div', { class: 'err' }, msg || '');
    const go = async () => {
      if (norm(input.value).length !== 8) { err.textContent = '휴대폰 번호를 확인하세요.'; return; }
      err.textContent = '확인 중...';
      try { const r = await fetchData(input.value); store.set(r.saved); render(r.data); }
      catch (e) { err.textContent = '코드가 맞지 않습니다.'; }
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    app.append(h('div', { class: 'login' }, h('button', { class: 'back', onclick: landing }, '‹ 처음으로'), h('h1', {}, '수강생 로그인'), h('p', { class: 'meta' }, '010 제외 8자리를 입력하세요.'), input, h('button', { onclick: go }, '입장'), err));
    input.focus();
  }

  function render(d) {
    app.replaceChildren();
    const tabs = ['자료', '일정'];
    const views = {};
    const bar = h('div', { class: 'tabs' });
    tabs.forEach((t, i) => {
      const b = h('button', { onclick: () => show(t) }, t);
      b.dataset.t = t; bar.append(b);
    });
    function show(t) {
      for (const k of tabs) views[k].classList.toggle('hide', k !== t);
      for (const b of bar.children) b.classList.toggle('on', b.dataset.t === t);
    }
    views['자료'] = materials(d); views['일정'] = schedule(d);
    app.append(
      h('div', { class: 'hdr' }, h('h1', {}, d.name), h('button', { onclick: () => { store.del(); landing(); } }, '나가기')),
      bar, ...tabs.map(t => views[t]));
    show('자료');
  }

  // 일정 = 매주 반복(weekly) + 개별 일정(schedule, 같은 날짜면 이쪽이 우선) - 취소일(skip)
  const WD = '일월화수목금토';
  const ymd = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  function lessonOn(d, x) {
    const k = ymd(x);
    const one = (d.schedule || []).find(s => s.date === k);
    if (one) return one;
    if ((d.skip || []).includes(k)) return null;
    return (d.weekly || []).find(w => WD.indexOf(w.day) === x.getDay() && (!w.from || k >= w.from) && (!w.until || k <= w.until)) || null;
  }
  function nextLesson(d) {
    const x = today();
    for (let i = 0; i < 400; i++, x.setDate(x.getDate() + 1)) { const l = lessonOn(d, x); if (l) return { date: ymd(x), ...l }; }
    return null;
  }
  // TODO: 알림 전송 기능 연결 전까지는 실제로 어디에도 전송하지 않는다.
  async function sendChangeRequest(info) { return true; }

  function schedule(d) {
    const v = h('div', {});
    const t0 = today();
    let cur = new Date(t0.getFullYear(), t0.getMonth(), 1);
    let sel = null;
    const head = h('div', { class: 'cal-h' });
    const grid = h('div', { class: 'cal' });
    const info = h('div', { class: 'card hero' });
    const sent = h('div', { class: 'sent' });

    function showInfo(date, l) {
      info.replaceChildren();
      if (!l) { info.append(h('div', { class: 'sm' }, '다음 수업'), h('div', { class: 'big' }, '예정된 수업 없음')); return; }
      const n = dday(date);
      info.append(h('div', { class: 'sm' }, date === (nextLesson(d) || {}).date ? '다음 수업' : '선택한 수업'),
        h('div', { class: 'big' }, fmt(date) + ' ' + (l.time || '')),
        h('div', { class: 'sm' }, (n >= 0 ? ddText(n) : '지난 수업') + (l.note ? ' · ' + l.note : '')));
    }
    function draw() {
      head.replaceChildren(
        h('button', { onclick: () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); draw(); } }, '‹'),
        h('b', {}, cur.getFullYear() + '년 ' + (cur.getMonth() + 1) + '월'),
        h('button', { onclick: () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); draw(); } }, '›'));
      grid.replaceChildren(...[...WD].map((c, i) => h('div', { class: 'w' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') }, c)));
      for (let i = 0; i < cur.getDay(); i++) grid.append(h('div', { class: 'c off' }));
      const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
      for (let day = 1; day <= last; day++) {
        const x = new Date(cur.getFullYear(), cur.getMonth(), day), k = ymd(x), l = lessonOn(d, x);
        const cls = ['c', x.getDay() === 0 ? 'sun' : x.getDay() === 6 ? 'sat' : '', k === ymd(t0) ? 'today' : '', l ? 'les' : '', l && x < t0 ? 'past' : '', k === sel ? 'sel' : ''];
        const c = h('div', { class: cls.filter(Boolean).join(' ') }, h('div', { class: 'n' }, day), l ? h('div', { class: 'tm' }, l.time || '수업') : null);
        if (l) c.addEventListener('click', () => { sel = k; showInfo(k, l); draw(); });
        grid.append(c);
      }
    }
    const nx = nextLesson(d);
    showInfo(nx ? nx.date : null, nx);
    draw();
    let day = null;
    const err = h('div', { class: 'err' });
    const time = h('input', { type: 'time' });
    const dp = h('div', { class: 'dp' });
    const drawDays = () => dp.replaceChildren(...[...WD].map(c => h('button', { class: c === day ? 'on' : '', onclick: () => { day = c; drawDays(); } }, c)));
    drawDays();
    const form = h('div', { class: 'card req hide' },
      h('div', { class: 't' }, '변경 희망 요일'), dp,
      h('div', { class: 't' }, '변경 희망 시간'), time,
      h('button', { class: 'go', onclick: async () => {
        if (!day || !time.value) { err.textContent = '요일과 시간을 선택하세요.'; return; }
        err.textContent = '';
        await sendChangeRequest({ name: d.name, from: nx && nx.date, day, time: time.value });
        form.classList.add('hide'); btn.classList.add('hide'); sent.textContent = '요청이 완료되었습니다.';
      } }, '변경 요청 보내기'),
      err,
      h('button', { class: 'x', onclick: () => { form.classList.add('hide'); btn.classList.remove('hide'); } }, '취소'));
    const btn = h('button', { class: 'chg', onclick: () => { sent.textContent = ''; form.classList.remove('hide'); btn.classList.add('hide'); } }, '일정 변경');
    v.append(info, head, grid, btn, form, sent);
    return v;
  }

  function materials(d) {
    const v = h('div', {});
    if (!d.materials.length) return h('div', { class: 'card empty' }, '등록된 자료 없음');
    d.materials.forEach(m => v.append(h('div', { class: 'card' }, h('a', { class: 'mat', href: m.url, target: '_blank', rel: 'noopener' }, h('span', {}, m.title), h('span', {}, '열기 ›')))));
    return v;
  }

  const saved = store.get();
  if (saved) fetchData(saved).then(r => render(r.data)).catch(() => { store.del(); login('저장된 코드로 열 수 없습니다. 다시 입력하세요.'); });
  else landing();
})();
</script>
</body>
</html>
