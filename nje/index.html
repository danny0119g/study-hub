<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>국어의 정답 · 실전 지문 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#111;--sub:#6b7280;--line:#e6e9ef;--acc:#5588dd;--soft:#e8f0fd;--ok:#1b8a5a;--bad:#d9480f;--okbg:#e6f5ee;--badbg:#fdece4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .brand{font:400 21px/1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;color:var(--ink);text-decoration:none;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
header.top h1{font-size:16px;margin:0;font-weight:700;color:var(--sub);padding-left:14px;border-left:1px solid var(--line)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:700;color:var(--ink)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
main{max-width:1560px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.grid.rd{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.grid.rd .card{padding:12px 14px}
.grid.rd .card b{font-size:17px}
@media (max-width:520px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.rd{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:12px 14px}.card b{font-size:17px}.grid.rd .card small:last-child{display:none}.hero{padding:18px}.hero h2{font-size:20px}header.top h1{font-size:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;display:block;width:100%;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--acc);box-shadow:0 4px 16px rgba(85,136,221,.16);transform:translateY(-1px)}
.card b{font-size:19px;display:block;letter-spacing:-.01em}
.card small{color:var(--sub)}
.bar{height:6px;background:#edf1f7;border-radius:4px;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:center;min-width:92px}
.tab small{display:block;color:var(--sub);font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.on small{color:#e3ecfb}
.tab.done::after{content:"✔";margin-left:6px;color:var(--ok);font-weight:800}
.tab.on.done::after{color:#bff0d3}
.view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pane{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}
.pane h3{margin:4px 8px 8px;font-size:14px;color:var(--sub)}
.pane img{width:100%;height:auto;display:block}
.pane img.ld{min-height:240px;background:#f1f3f5}
.sticky{position:sticky;top:64px}
.ans{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.row{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:8px}
.row .n{width:40px;font-weight:800}
.row .c{display:flex;gap:6px;flex-wrap:wrap}
.ch{width:42px;height:42px;border-radius:50%;border:1.5px solid #b8bec9;background:#fff;font-size:17px;font-weight:700}
.ch:hover{border-color:var(--acc)}
.ch.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.ch.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.key{border:3px solid var(--ok);color:var(--ok)}
.row.ok{background:var(--okbg)}.row.no{background:var(--badbg)}
.res{margin-left:auto;font-weight:800}
.row.ok .res{color:var(--ok)}.row.no .res{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.score{font-weight:800}
.mtabs{display:none;gap:6px;margin-bottom:10px}
.mtabs .btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.note{color:var(--sub);font-size:13px;margin:6px 2px 14px}
@media (max-width:980px){.view{grid-template-columns:1fr}.sticky{position:static}.mtabs{display:flex}.view.m-p .qpane,.view.m-q .ppane{display:none}}

.sec{margin:26px 2px 10px;font-size:15px;font-weight:800;color:var(--ink)}
.sec small{color:var(--sub);font-weight:600;margin-left:6px;font-size:13px}
.yr{margin:34px 2px 2px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:6px}
.hero h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--sub);font-size:15px}
.hero .stats{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.hero .stats b{display:block;font-size:22px;color:var(--acc)}
.hero .stats span{font-size:13px;color:var(--sub);font-weight:600}
.card .done{color:var(--ok);font-weight:700}
.cat{text-align:left}
.cat b{font-size:20px}
.tag{display:inline-block;font-size:12px;font-weight:800;background:var(--soft);color:var(--acc);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.tab.on .tag{background:rgba(255,255,255,.25);color:#fff}
.tabs.many .tab{min-width:70px;padding:6px 8px}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand">국어의 정답</button><h1 id="ttl">실전 지문 연습</h1>
  <span class="sp"></span>
  <span class="timer" id="timer" hidden></span>
  <button class="btn" id="tbtn" hidden></button>
  <button class="btn" id="home" hidden>← 전체 목록</button>
</header>
<main id="app"></main>

  let done=0;for(const e of DATA){const s=state(e.id);for(const p of e.ps)if(s.graded[p.f])done++}
  let h=`<section class="hero"><h2>이감 모의고사 독서·문학</h2><p>공통 4~34번을 지문 단위로 풀고 바로 채점합니다. 기록은 이 기기에 저장됩니다.</p>
  <div class="stats"><div><b>${DATA.length}</b><span>회차</span></div><div><b>${np}</b><span>지문</span></div><div><b>${nqs.toLocaleString()}</b><span>문항</span></div><div><b>${done}</b><span>채점 완료 지문</span></div></div></section>`;
  const catCard=c=>{const [n,t]=catProgress(c);return `<button class="card cat" data-c="${c}"><b>${CATS[c]}</b><small>${t}지문</small><div class="bar"><i style="width:${n/t*100}%"></i></div><small>${n?`<span class="done">${n}</span> / ${t} 채점`:"아직 안 풂"}</small></button>`};
  h+='<div class="sec">독서 유형별 모아 풀기</div><div class="grid">'+RC.map(catCard).join("")+'</div>';
  h+='<div class="sec">문학 유형별 모아 풀기</div><div class="grid">'+LC.map(catCard).join("")+'</div>';
  const yrs=[...new Set(DATA.map(e=>e.yr))];
  for(const y of yrs){
    h+=`<div class="yr">${y}학년도</div>`;
    const sers=[...new Set(DATA.filter(e=>e.yr===y).map(e=>e.ser))];
    for(const sr of sers){
      const es=DATA.filter(e=>e.yr===y&&e.ser===sr);
      h+=`<div class="sec">${sr}<small>${es.length}회</small></div><div class="grid rd">`;
      for(const e of es){
        const s=state(e.id);let n=0;for(const p of e.ps)if(s.graded[p.f])n++;
        h+=`<button class="card ex" data-id="${e.id}"><b>${e.lab.replace(sr+" ","")}</b><small>${e.ps.length}지문 · ${nq(e)}문항</small><div class="bar"><i style="width:${n/e.ps.length*100}%"></i></div><small>${n?`<span class="done">${n}</span> / ${e.ps.length}지문 채점`:"아직 안 풂"}</small></button>`;
      }
      h+='</div>';
    }
  }
  $("#app").innerHTML=h;
  document.querySelectorAll(".card.ex").forEach(b=>b.onclick=()=>go(b.dataset.id));
  document.querySelectorAll(".card.cat").forEach(b=>b.onclick=()=>go("c-"+b.dataset.c));
}
function go(h){location.hash=h;route()}

function fmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function startTimer(id){
  clearInterval(tm);const s=state(id);let run=false;
  const t=$("#timer"),b=$("#tbtn");t.hidden=false;b.hidden=false;t.textContent=fmt(s.sec||0);b.textContent="▶ 타이머";
  b.onclick=()=>{
    run=!run;b.textContent=run?"⏸ 멈춤":"▶ 타이머";
    clearInterval(tm);
    if(run)tm=setInterval(()=>{const st=state(id);st.sec=(st.sec||0)+1;set(stKey(id),st);t.textContent=fmt(st.sec)},1000);
  };
}

function openExam(id){
  const e=exam(id);if(!e){home();return}
  view={kind:"exam",id,items:e.ps.map(p=>({e,p}))};pi=0;mode="p";
  $("#ttl").textContent=full(e);$("#home").hidden=false;
  startTimer(id);render();
}
function openCat(c){
  if(!CATS[c]){home();return}
  clearInterval(tm);$("#timer").hidden=true;$("#tbtn").hidden=true;$("#timer").dataset.for="";
  view={kind:"cat",id:c,items:catItems(c)};
  const st=get("njs:pos:"+c,0);pi=Math.min(st,view.items.length-1);mode="p";
  $("#ttl").textContent=CATS[c]+" 모아 풀기";$("#home").hidden=false;render();
}

function render(){
  const it=view.items[pi],e=it.e,p=it.p,s=state(e.id);
  if(view.kind==="cat")set("njs:pos:"+view.id,pi);
  const ia=k=>`src="img/${e.id}/${k}.jpg"`;
  let h='<div class="tabs'+(view.kind==="cat"?" many":"")+'">';
  view.items.forEach((x,i)=>{
    const sx=state(x.e.id),d=sx.graded[x.p.f];
    if(view.kind==="exam"){
      h+=`<button class="tab ${i===pi?"on":""} ${d?"done":""}" data-i="${i}">${pname(x.e,x.p)}<span class="tag">${CATS[x.p.c]}</span><small>${x.p.q[0]}~${x.p.q[1]}번</small></button>`;
    }else{
      h+=`<button class="tab ${i===pi?"on":""} ${d?"done":""}" data-i="${i}">#${i+1}<small>${String(x.e.yr).slice(2)} ${label(x.e)} · ${x.p.q[0]}~${x.p.q[1]}</small></button>`;
    }
  });
  h+=`</div><div class="mtabs"><button class="btn ${mode==="p"?"on":""}" data-m="p">지문</button><button class="btn ${mode==="q"?"on":""}" data-m="q">문제·답안</button></div>`;
  const cap=view.kind==="cat"?`${CATS[p.c]} #${pi+1} · ${full(e)} ${pname(e,p)} · ${p.q[0]}~${p.q[1]}번`:`${pname(e,p)} · ${CATS[p.c]}`;
  h+=`<div class="view m-${mode}"><div class="pane ppane"><h3>지문 — ${cap}</h3><img ${ia(p.f)} alt="지문"></div>`;
  h+=`<div class="qpane"><div class="pane"><h3>문제</h3><img ${ia(p.f+"_q")} alt="문제"></div><div class="ans">`;
  const g=!!s.graded[p.f];let ok=0,tot=0;
  for(let q=p.q[0];q<=p.q[1];q++){
    const key=String(q),ans=p.a[key],sel=s.sel[key];tot++;
    let rc="",res="";
    if(g){if(sel===ans){ok++;rc="ok";res="정답"}else{rc="no";res=(sel?"오답":"미응답")+" · 답 "+"①②③④⑤"[ans-1]}}
    h+=`<div class="row ${rc}"><span class="n">${q}번</span><span class="c">`;
    for(let c=1;c<=5;c++){
      let cl="ch";
      if(g){ if(c===ans)cl+=" key"; if(sel===c&&c!==ans)cl+=" wrong"; if(sel===c&&c===ans)cl+=" right";}
      else if(sel===c)cl+=" sel";
      h+=`<button class="${cl}" data-q="${key}" data-c="${c}" ${g?"disabled":""}>${c}</button>`;
    }
    h+=`</span><span class="res">${res}</span></div>`;
  }
  h+=`<div class="acts">`;
  if(!g)h+=`<button class="btn pri" id="grade">이 지문 채점</button>`;
  else h+=`<span class="score">${ok} / ${tot}</span><button class="btn" id="redo">다시 풀기</button>`;
  h+=`<span class="sp"></span>`;
  if(pi>0)h+=`<button class="btn" id="prev">← 이전</button>`;
  if(pi<view.items.length-1)h+=`<button class="btn" id="next">다음 →</button>`;
  h+=`</div></div></div></div>`;
  $("#app").innerHTML=h;
  const nx=view.items[pi+1];if(nx)setTimeout(()=>{for(const k of [nx.p.f,nx.p.f+"_q"]){const im=new Image();im.src=`img/${nx.e.id}/${k}.jpg`}},600);
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{pi=+b.dataset.i;mode="p";render();window.scrollTo(0,0)});
  document.querySelectorAll(".mtabs .btn").forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    const st=state(e.id);const q=b.dataset.q,c=+b.dataset.c;
    if(st.sel[q]===c)delete st.sel[q];else st.sel[q]=c;
    set(stKey(e.id),st);render();
  });
  const gb=$("#grade");if(gb)gb.onclick=()=>{const st=state(e.id);st.graded[p.f]=true;set(stKey(e.id),st);render()};
  const rb=$("#redo");if(rb)rb.onclick=()=>{const st=state(e.id);delete st.graded[p.f];for(let q=p.q[0];q<=p.q[1];q++)delete st.sel[q];set(stKey(e.id),st);render()};
  const nb=$("#next");if(nb)nb.onclick=()=>{pi++;mode="p";render();window.scrollTo(0,0)};
  const pb=$("#prev");if(pb)pb.onclick=()=>{pi--;mode="p";render();window.scrollTo(0,0)};
}

function route(){
  const h=location.hash.replace("#","");
  if(exam(h))openExam(h);
  else if(/^c-[a-z]+$/.test(h))openCat(h.slice(2));
  else home();
}
$("#home").onclick=()=>go("");$("#brand").onclick=()=>go("");
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
