<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>국어의 정답 · 과거의 유산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#0f1115;--ink2:#3d4350;--sub:#7a808c;--line:#e7eaf0;--line2:#d9dee7;--acc:#5588dd;--acc2:#3f6fc2;--soft:#eaf1fc;--ok:#1b8a5a;--okbg:#e7f6ee;--bad:#d9480f;--badbg:#fdeee6;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1480px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px}
.brand{font:400 22px/1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;background:none;border:0;padding:0;letter-spacing:-.01em;white-space:nowrap;flex:none}
.btn{white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--sub);font-weight:600;font-size:15px;min-width:0}
.crumb b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--line2)}
.crumb button{background:none;border:0;padding:0;color:var(--sub);font-weight:600}
.crumb button:hover{color:var(--acc)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:9px 15px;font-weight:700;font-size:15px;transition:all .15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn svg{width:17px;height:17px}
main{max-width:1480px;margin:0 auto;padding:26px 22px 60px}
/* home */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:6px 0 26px}
.hero h1{margin:0;font-size:32px;line-height:1.2;letter-spacing:-.03em;font-weight:800}
.hero p{margin:8px 0 0;color:var(--sub);font-size:16px}
.stat{display:flex;gap:26px;margin-top:16px}
.stat div{font-size:13px;color:var(--sub);font-weight:600}
.stat b{display:block;font-size:24px;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rand{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#5588dd,#3f6fc2);color:#fff;border:0;border-radius:18px;padding:18px 22px;box-shadow:0 8px 24px rgba(63,111,194,.28);text-align:left;transition:transform .15s,box-shadow .15s}
.rand:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(63,111,194,.34)}
.rand .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.rand .ic svg{width:24px;height:24px}
.rand b{display:block;font-size:18px}
.rand small{opacity:.85;font-size:13px}
.grp{margin:26px 0 12px;font-size:14px;font-weight:800;color:var(--sub);letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border-top:4px solid var(--c)!important;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.tile:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 10px 24px rgba(16,24,40,.08)}
.tile .dot{width:38px;height:38px;border-radius:11px;background:var(--cb);color:var(--c);display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:14px}
.tile b{display:block;font-size:22px;letter-spacing:-.02em}
.tile .n{color:var(--sub);font-size:14px;font-weight:600;margin-top:2px}
.prog{height:6px;border-radius:6px;background:#eef1f6;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--acc));border-radius:6px}
#rnd[hidden]{display:none!important}.tile{cursor:pointer}.tile .tr{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--cb);color:var(--c);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}.tile .tr:hover{background:var(--c);color:#fff;border-color:var(--c)}.tile .tr svg{width:14px;height:14px}
.tile .pc{font-size:13px;color:var(--sub);margin-top:8px;font-weight:600}
/* list */
.lhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
.lhead h1{margin:0;font-size:30px;letter-spacing:-.03em}
.lhead .n{color:var(--sub);font-weight:600}
.seg{display:inline-flex;background:#eceff4;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--acc);box-shadow:0 4px 14px rgba(16,24,40,.06)}
.item .k{flex:1;min-width:0}
.item .k b{display:block;font-size:16px;font-weight:700;line-height:1.35}
.item .k small{color:var(--sub);font-size:13px;font-weight:600}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.badge.new{background:#f1f3f7;color:var(--sub)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.mid{background:#fff4e0;color:#a35e00}
.empty{color:var(--sub);text-align:center;padding:50px 0}
.item{cursor:pointer}
.pk{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;padding:0;color:transparent;transition:all .12s}
.pk svg{width:16px;height:16px}.pk:hover{border-color:var(--acc)}
.pk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lhead .btn{padding:8px 13px;font-size:14px}
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;width:min(760px,calc(100% - 24px));display:flex;align-items:center;gap:12px;background:#151922;color:#fff;border-radius:16px;padding:10px 10px 10px 18px;box-shadow:0 12px 32px rgba(10,14,22,.28);flex-wrap:wrap}
#bar[hidden]{display:none}
#bar .bn{font-weight:600;font-size:15px}#bar .bn b{font-size:17px}
#bar .lk{background:none;border:0;color:#aeb8cc;font-weight:700;font-size:14px;padding:6px 4px}#bar .lk:hover{color:#fff}
#bar .ck{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#d6dbe6;cursor:pointer}
#bar .ck input{width:16px;height:16px;accent-color:var(--acc)}
#bar .msg{font-weight:700;font-size:14px;color:#cfe0ff;padding:9px 6px}
#bar .btn.pri{border-radius:11px}
body.hasbar main{padding-bottom:120px}
body.hasbar .qimg{max-height:calc(100vh - 420px)}
.phead .btn{margin-left:auto;padding:7px 12px;font-size:14px}.phead .btn.on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
/* passage */
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:13px;font-weight:800;border-radius:999px;padding:5px 12px;background:var(--cb);color:var(--c)}
.phead h1{margin:0;font-size:22px;letter-spacing:-.02em}
.phead .q{color:var(--sub);font-weight:600}
.view{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.pane{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);overflow:hidden}
.pane img{width:100%;height:auto;display:block;border-radius:10px}
.pane img.ld{min-height:320px;background:linear-gradient(90deg,#f1f3f6 0%,#f8f9fb 50%,#f1f3f6 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.qimg{max-height:calc(100vh - 340px);overflow:auto}
.sheet{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 10px;font-size:15px;color:var(--sub);font-weight:800;display:flex;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px}
.row .no{width:44px;font-weight:800;font-variant-numeric:tabular-nums}
.row .cs{display:flex;gap:8px}
.ch{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:16px;transition:all .12s}
.ch:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.ch.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.ch.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.key{border:2.5px solid var(--ok);color:var(--ok)}
.ch.key.right,.ch.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.ch:disabled{cursor:default}
.row.ok{background:var(--okbg)}.row.no{background:var(--badbg)}
.row .rs{margin-left:auto;font-size:13px;font-weight:800}
.row.ok .rs{color:var(--ok)}.row.no .rs{color:var(--bad)}
.acts{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.score{font-size:20px;font-weight:800;margin-right:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.mtab{display:none}
@media (max-width:980px){
 .view{grid-template-columns:1fr}.side{position:static}.qimg{max-height:none}
 .mtab{display:flex;margin-bottom:12px}
 .view.mp .side .qimg,.view.mq .ppane{display:none}
}
@media (max-width:560px){
 #bar{bottom:10px;padding:10px 10px 10px 14px;gap:8px 10px}#bar .bn{font-size:14px}
 .top .in{padding:10px 14px;gap:10px}.brand{font-size:19px}.crumb{display:none}#rnd span{display:none}
 main{padding:18px 14px 50px}.hero h1{font-size:26px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:16px}.tile b{font-size:19px}
 .rand{width:100%}.list{grid-template-columns:1fr}
 .ch{width:36px;height:36px;font-size:15px}.row .no{width:38px}.row{gap:6px;padding:6px 4px}.cs{gap:5px!important}
 .phead h1{font-size:18px}
}
</style>
</head>

<main id="app"></main>
<div id="bar" hidden></div>

function duoPart(eid,k){const f=k.replace(/_q$/,""),q=k!==f,key=eid+"/"+f;
  if(!DUO[key])DUO[key]=(IDX||(IDX=fetch("img/idx.json").then(r=>{if(!r.ok)throw 0;return r.json()}).catch(e=>{IDX=null;throw e}))).then(ix=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok([im,ix[key]]);im.onerror=no;im.src=`img/${eid}/${f}.webp`})).then(([im,d])=>{
    const cut=(x,w,h)=>new Promise(ok=>{const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(im,x,0,w,h,0,0,w,h);cv.toBlob(b=>{cv.width=cv.height=1;ok(URL.createObjectURL(b))},"image/jpeg",.9)});
    return Promise.all([cut(0,d[0],d[1]),cut(d[0],d[2],d[3])])}).catch(e=>{delete DUO[key];throw e});
  return DUO[key].then(u=>u[q?1:0])}
function imgUrl(eid,k){
  if(MODE==="duo")return duoPart(eid,k);
  if(MODE==="dir")return Promise.resolve(`img/${eid}/${k}${EXT}`);
  if(!PK[eid])PK[eid]=fetch("pk/"+eid+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const m={};for(const kk in j){const b=atob(j[kk]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);m[kk]=URL.createObjectURL(new Blob([u],{type:"image/jpeg"}))}return m}).catch(e=>{delete PK[eid];throw e});

}

// ---------- PDF writer ----------
const A4W=595.28,A4H=841.89,MX=30,MT=46,MB=30,GT=20,CW=(A4W-2*MX-GT)/2;
const f2=v=>(Math.round(v*100)/100).toString();
function jpgInfo(d){let i=2;while(i<d.length-9){if(d[i]!==0xFF){i++;continue}const m=d[i+1];if(m===0xD8||m===0xFF||m===0x01||(m>=0xD0&&m<=0xD7)){i+=m===0xFF?1:2;continue}const len=d[i+2]<<8|d[i+3];
  if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{h:d[i+5]<<8|d[i+6],w:d[i+7]<<8|d[i+8],nc:d[i+9]};i+=2+len}throw new Error("jpeg")}
class PW{
  constructor(){this.o=[]}
  reserve(){this.o.push(null);return this.o.length}
  put(n,parts){this.o[n-1]=parts}
  add(parts){const n=this.reserve();this.put(n,parts);return n}
  img(d){const f=jpgInfo(d);return{n:this.add([`<< /Type /XObject /Subtype /Image /Width ${f.w} /Height ${f.h} /ColorSpace /${f.nc===1?"DeviceGray":f.nc===4?"DeviceCMYK":"DeviceRGB"} /BitsPerComponent 8 /Filter /DCTDecode /Length ${d.length} >>\nstream\n`,d,"\nendstream"]),w:f.w,h:f.h}}
  stream(s){return this.add([`<< /Length ${s.length} >>\nstream\n${s}\nendstream`])}
  blob(root){const E=new TextEncoder(),ch=[new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A])];let off=ch[0].length;const xs=[];
    const push=p=>{const u=typeof p==="string"?E.encode(p):p;ch.push(u);off+=u.length};
    this.o.forEach((parts,i)=>{xs.push(off);push(`${i+1} 0 obj\n`);parts.forEach(push);push("\nendobj\n")});
    const xo=off;let x=`xref\n0 ${this.o.length+1}\n0000000000 65535 f \n`;for(const v of xs)x+=String(v).padStart(10,"0")+" 00000 n \n";
    push(x+`trailer\n<< /Size ${this.o.length+1} /Root ${root} 0 R >>\nstartxref\n${xo}\n%%EOF\n`);return new Blob(ch,{type:"application/pdf"})}
}
async function getBytes(eid,k){const u=await imgUrl(eid,k);const r=await fetch(u);if(!r.ok)throw new Error("img");const d=new Uint8Array(await r.arrayBuffer());if(d[0]===0xFF&&d[1]===0xD8)return d;
  const bm=await new Promise((ok,no)=>{const im=new Image();const bu=URL.createObjectURL(new Blob([d]));im.onload=()=>{URL.revokeObjectURL(bu);ok(im)};im.onerror=no;im.src=bu});
  const cv=document.createElement("canvas");cv.width=bm.naturalWidth;cv.height=bm.naturalHeight;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(bm,0,0);
  const out=await new Promise(ok=>cv.toBlob(b=>b.arrayBuffer().then(a=>ok(new Uint8Array(a))),"image/jpeg",.85));cv.width=cv.height=1;return out}
async function blankMap(d){
  const bm=await new Promise((ok,no)=>{const im=new Image();const u=URL.createObjectURL(new Blob([d],{type:"image/jpeg"}));im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=no;im.src=u});
  const w=bm.naturalWidth,h=bm.naturalHeight,cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d",{willReadFrequently:true});g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(bm,0,0);
  const px=g.getImageData(0,0,w,h).data,bl=new Uint8Array(h);
  const T=Math.max(2,Math.round(w*0.004));for(let y=0;y<h;y++){let c=0,o=y*w*4;for(let x=0;x<w;x++,o+=4)if(px[o]<130&&++c>T)break;bl[y]=c<=T?1:0}
  cv.width=cv.height=1;return bl;
}
function findCut(bl,lo,hi){let best=-1,bs=0,i=lo;
  while(i<=hi){if(bl[i]){let s0=i;while(i<bl.length&&bl[i])i++;const len=i-s0;if(len>=4){const c=Math.min(hi,s0+Math.min(len>>1,12));if(len>=bs){bs=len;best=c}}}else i++}
  return best<0?hi:best}
function textJpg(draw,wpt,hpt,sc){const cv=document.createElement("canvas");cv.width=Math.round(wpt*sc);cv.height=Math.round(hpt*sc);const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.scale(sc,sc);g.fillStyle="#111";g.textBaseline="alphabetic";draw(g);
  return new Promise(ok=>cv.toBlob(b=>b.arrayBuffer().then(a=>ok(new Uint8Array(a))),"image/jpeg",.92))}
const FONT='"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';

async function makePdf(L,withAns,prog){
  const pw=new PW(),cat=pw.reserve(),pages=pw.reserve(),kids=[];let pg=null;
  const flush=()=>{if(!pg)return;const res=Object.keys(pg.res).map(n=>`/I${n} ${n} 0 R`).join(" ");const cn=pw.stream(pg.cs.join("\n"));
    kids.push(pw.add([`<< /Type /Page /Parent ${pages} 0 R /MediaBox [0 0 ${A4W} ${A4H}] /Resources << /XObject << ${res} >> >> /Contents ${cn} 0 R >>`]));pg=null};
  const use=(im,cmd)=>{pg.res[im.n]=1;pg.cs.push(cmd)};
  for(let i=0;i<L.length;i++){
    const x=L[i];prog(i,L.length);
    const hd=pw.img(await textJpg(g=>{g.font=`700 10.5px ${FONT}`;g.fillText(`${i+1}.  ${x.name}`,0,12);const t=`${CN[x.c]} · ${x.p.q[0]}~${x.p.q[1]}번`;g.font=`600 9.5px ${FONT}`;g.fillStyle="#555";g.fillText(t,A4W-2*MX-g.measureText(t).width,12)},A4W-2*MX,16,4));
    let col=0,y=MT;
    const newPage=()=>{flush();pg={cs:[],res:{}};use(hd,`q ${f2(A4W-2*MX)} 0 0 16 ${MX} ${f2(A4H-22-16)} cm /I${hd.n} Do Q`);
      pg.cs.push(`q 0.15 G 0.8 w ${MX} ${f2(A4H-MT+6)} m ${f2(A4W-MX)} ${f2(A4H-MT+6)} l S 0.75 G 0.5 w ${f2(A4W/2)} ${MB} m ${f2(A4W/2)} ${f2(A4H-MT+2)} l S Q`);col=0;y=MT};
    const nextCol=()=>{if(col===0){col=1;y=MT}else newPage()};
    newPage();

      const d=await getBytes(x.e.id,k),im=pw.img(d),bl=await blankMap(d),s=CW/im.w;
      let r=0,end=im.h;while(r<end&&bl[r])r++;while(end>r&&bl[end-1])end--;
      const isQ=k!==x.p.f,colPx=Math.floor((A4H-MB-MT)/s);
      if(isQ&&y>MT&&(end-r)*s>A4H-MB-y&&(A4H-MB-y)<(A4H-MB-MT)*.4)nextCol();
      while(r<end){
        const avail=Math.floor((A4H-MB-y)/s);
        if(avail<60){nextCol();continue}
        const cut=end-r<=avail?end:findCut(bl,r+Math.floor(avail*(isQ?.3:.75)),r+avail);
        const X=MX+col*(CW+GT),hh=(cut-r)*s;
        use(im,`q ${f2(X)} ${f2(A4H-y-hh)} ${f2(CW)} ${f2(hh)} re W n ${f2(im.w*s)} 0 0 ${f2(im.h*s)} ${f2(X)} ${f2(A4H-y+r*s-im.h*s)} cm /I${im.n} Do Q`);
        y+=hh;r=cut;
        if(r<end){while(r<end&&bl[r])r++;nextCol()}
      }
      y+=18;
    }
  }
  flush();
  if(withAns){
    const per=17;
    for(let s0=0;s0<L.length;s0+=per){
      const part=L.slice(s0,s0+per);
      const im=pw.img(await textJpg(g=>{g.font=`800 20px ${FONT}`;g.fillText(s0?"정답 (이어서)":"정답",MX,58);
        let yy=96;part.forEach((x,j)=>{const n=s0+j+1;g.fillStyle="#111";g.font=`700 11.5px ${FONT}`;g.fillText(`${n}.  ${x.name}`,MX,yy);
          g.font=`600 10px ${FONT}`;g.fillStyle="#666";const t=`${CN[x.c]} · ${x.p.q[0]}~${x.p.q[1]}번`;g.fillText(t,A4W-MX-g.measureText(t).width,yy);
          let xx=MX+14;g.fillStyle="#111";g.font=`600 12.5px ${FONT}`;for(let q=x.p.q[0];q<=x.p.q[1];q++){const a=`${q}번 ${CIR[x.p.a[q]-1]||x.p.a[q]}`;g.fillText(a,xx,yy+19);xx+=g.measureText(a).width+22}
          g.strokeStyle="#e3e3e3";g.lineWidth=.6;g.beginPath();g.moveTo(MX,yy+31);g.lineTo(A4W-MX,yy+31);g.stroke();yy+=42});},A4W,A4H,2.2));
      pg={cs:[],res:{}};use(im,`q ${A4W} 0 0 ${A4H} 0 0 cm /I${im.n} Do Q`);flush();
    }
  }
  pw.put(pages,[`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`]);
  pw.put(cat,[`<< /Type /Catalog /Pages ${pages} 0 R >>`]);
  return pw.blob(cat);
}
async function download(){
  if(busy)return;const L=bkSorted();if(!L.length)return;busy=true;
  const withAns=get("njs:ans",true);
  try{
    const blob=await makePdf(L,withAns,(i,n)=>bar(`PDF 만드는 중… ${i+1} / ${n}`));
    const dt=new Date(),ds=`${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,"0")}${String(dt.getDate()).padStart(2,"0")}`;
    const name=`과거의 유산_${ds}_${L.length}지문.pdf`;
    bar("저장 창을 확인하세요");
    let dl=null;try{if(MODE==="pack"&&window.claude&&claude.use)dl=await claude.use("downloads")}catch(e){}
    if(dl){try{await dl.save({filename:name,data:blob})}catch(e){if(e&&e.code!=="declined")alert("저장하지 못했습니다: "+(e.message||e.code))}}
    else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
  }catch(e){console.error(e);alert("PDF를 만들지 못했습니다. 새로고침 후 다시 시도해 주세요.")}
  busy=false;bar();
}

window.addEventListener("hashchange",route);
route();bar();
